[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-engine"
version = "0.1.0"
description = "Decomposing the Inference Speedup Gap: A Minimal ML Inference Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "numba>=0.57.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "pytest>=7.0.0",
    "psutil>=5.9.0",
    "tabulate>=0.9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
